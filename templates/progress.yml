# ---------------------------------------------------------------------------------------
# The `note` field is the most valuable one in this file. Write down what you know you do
# not understand. That list is your actual curriculum, and it is more useful than any of
# the state values.
#
# Review this every month or two, and ask:
#
#   - Many `learning` and few `built`? High knowledge, low skill. That is tutorial hell.
#   - Many `built` and no `validated`? You build but never verify. You will be confidently
#     wrong under load.
#   - More than three or four topics in `started`/`learning` at once? That is technology
#     hopping. Finish something.
#   - More `mastered` entries than systems you have run in production? The tracker is
#     measuring optimism. Recalibrate against docs/levels.md.
#
# `mastered` is not "I did the gates". It means at least one of: you taught it and the
# person then did it unaided; you debugged a novel failure others could not; you contributed
# to a tool implementing it; or you made an architectural decision involving it and lived
# with the consequences.
#
# `validated` is a genuinely strong position. Most working engineers are `validated` on most
# of what they use daily, and that is fine. Inflating it costs you the ability to tell the
# difference, which is the only thing this file is for.
